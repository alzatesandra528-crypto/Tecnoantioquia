<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso | TECNOANTIOQUIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-body">

    <main class="login-wrap">
        <div class="login-card">
            <img src="img/Logo-tecnoantioquia.jpg" alt="Logo de TECNOANTIOQUIA" class="login-logo">
            <h1>Control de inventario</h1>
            <p>Ingresa con tu usuario de administrador o vendedor.</p>

            <form id="loginForm">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>

                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required>

                <button class="btn btn-warning w-100" type="submit">
                    Ingresar
                </button>
            </form>

            <p id="loginError" class="alert alert-danger mt-3 d-none" role="alert"></p>

            <a class="d-block mt-4 text-center" href="index.html">Volver al sitio</a>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
