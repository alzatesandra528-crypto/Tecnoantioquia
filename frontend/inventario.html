<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | TECNOANTIOQUIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="app-body">

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">TECNOANTIOQUIA</a>
            <div class="d-flex align-items-center gap-3">
                <span id="userBadge" class="user-badge"></span>
                <button id="logoutBtn" class="btn btn-sm btn-outline-light" type="button">
                    Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="page-title mb-1">Inventario</h1>
                <p class="mb-0" id="roleHint"></p>
            </div>
            <button id="newProductBtn" class="btn btn-warning d-none" type="button">
                <i class="bi bi-plus-lg"></i> Nuevo producto
            </button>
        </div>

        <p id="appAlert" class="alert d-none" role="alert"></p>

        <div class="table-responsive panel-card mb-4">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>SKU</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="productsTable"></tbody>
            </table>
        </div>

        <section class="panel-card p-4">
            <h2 class="h5 mb-3">Últimas ventas</h2>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Total</th>
                            <th>Vendedor</th>
                        </tr>
                    </thead>
                    <tbody id="salesTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="productForm">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="productModalTitle">Producto</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="productId">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control mb-3" id="nombre" required>

                    <label class="form-label" for="sku">SKU</label>
                    <input class="form-control mb-3" id="sku" required>

                    <label class="form-label" for="categoria">Categoría</label>
                    <input class="form-control mb-3" id="categoria" required>

                    <label class="form-label" for="precio">Precio</label>
                    <input class="form-control mb-3" id="precio" type="number" min="0" step="0.01" required>

                    <label class="form-label" for="stock">Stock</label>
                    <input class="form-control mb-3" id="stock" type="number" min="0" step="1" required>

                    <label class="form-label" for="descripcion">Descripción</label>
                    <textarea class="form-control" id="descripcion" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-warning" type="submit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="saleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="saleForm">
                <div class="modal-header">
                    <h2 class="modal-title h5">Registrar venta</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="saleProductId">
                    <p class="mb-2" id="saleProductName"></p>
                    <label class="form-label" for="saleCantidad">Cantidad</label>
                    <input class="form-control" id="saleCantidad" type="number" min="1" step="1" required>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-warning" type="submit">Confirmar venta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/inventario.js"></script>
</body>

</html>
